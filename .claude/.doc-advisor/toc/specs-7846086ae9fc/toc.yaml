  docs/specs/base/design/ADR-006_index_docs_parallel_fill_performance.md:
    title: ADR-006 index-docs Parallel Fill Performance
    purpose: Records the decision to speed up the toc-updater fill phase via a wider window, a compressed format doc, and limited batching, gated on measured extraction quality
    content_details:
      - "Measurements: ~18s and ~24K tokens per document, effective parallelism verified at 10"
      - Bottleneck is launch-count overhead and tail latency, not insufficient parallelism
      - "Context rot as central concern: mixing documents in one context causes cross-document keyword misattribution"
      - "Plan A: raise distributed default window from 5 to 10 (verified safe with 429 degradation to 5/3 for low tier)"
      - "Plan C: compress formats/toc_format.md so per-document context shrinks (speed and quality move together)"
      - "Plan B: limited batching of k=2-3 same-directory neighbours, gated on quality measurement"
      - Grouping decided deterministically by script; AI grouping by hand forbidden
      - "Continuous dispatch with claim/lease replaced foreground barrier waves: 12.6% makespan gain measured (Issue #29)"
      - Free-slot arithmetic moved into index_docs.py because window minus in_flight_groups must not be recomputed by AI
      - "Rejected: official multi-agent orchestration (not reachable from SKILL runtime) and auto-selecting barrier vs continuous"
    applicable_tasks:
      - Changing the parallel window or batch size of toc-updater fill
      - Diagnosing slow or rate-limited indexing on large corpus
      - Deciding whether dispatch control belongs to script or AI
      - Reviewing extraction quality after batching change
      - Understanding why claim and lease exist in toc_store.py
