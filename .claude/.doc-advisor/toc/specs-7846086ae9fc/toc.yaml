  docs/specs/base/design/DES-003_document_identifier.md:
    title: "DES-003: Document Identifier Design"
    purpose: Defines document identification using project-root-relative file paths as sole identifier, eliminating ID prefix requirements and enabling key+path two-layer identification for ToC management
    content_details:
      - "Document identification principle: project-root-relative file path as sole unique identifier"
      - Problem analysis of mixed ID methods (filename-based extraction vs path-based keys)
      - "Four identified problems: ID naming enforcement, ID duplication risk, dual management, ambiguous prefix meanings"
      - SHA-256 hash (first 16 chars) based work file naming in .toc_work/ directory to avoid ID dependency
      - "Two-layer identification framework: key (opaque ToC management unit) + path (document unique key within that key)"
      - Elimination of extract_id_from_filename() function and ID-based duplicate checking (replaced with path-based checking)
      - "Migration plan with three phases: document update, code cleanup, functionality verification"
      - Recommended but non-enforced file naming conventions (content-descriptive names preferred over ID-based)
      - Preservation of source_file path in _meta.source_file within work YAML files
