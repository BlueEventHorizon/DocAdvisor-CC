      - Mandatory constraints on dispatcher and worker for read-only behavior and output contracts
      - Query normalization requirement to prevent parent task instructions from reaching worker
      - Guidance reading responsibility in dispatcher vs. worker (decision deferred)
      - Multi-layer defense strategy including execution isolation, role constraints, prompt normalization
      - Regression prevention through tests verifying SKILL definition and Agent properties
