  docs/specs/base/design/ADR-006_index_docs_parallel_fill_performance.md:
    title: "ADR-006: index-docs Parallel Fill Performance Optimization (Increased Parallelism, Format Compression, Limited Batching)"
    purpose: Defines optimization strategy for index-docs Phase 2 to accelerate ToC filling from 1-2 hours to ~10 minutes via parallelism increase, format compression, and limited batching with quality verification
    content_details:
      - "Three-tier optimization strategy: parallelism increase (5→10), toc_format.md compression, limited batching (k=2-3)"
      - Context rot risk analysis and context-independent extraction requirement for multiple documents per agent
      - Sliding-window continuous dispatch (claim/lease based) instead of barrier-based wave loops to reduce tail latency
      - Quality measurement gate for batch mode using golden set testing (rules+specs, 43 queries, FN/FP=0)
      - "Measured performance improvement: 38% time reduction, 53% token reduction per document with batching"
      - Agent tool subagents adopted as only reliable orchestration basis for marketplace plugin distribution
      - Rejection of official multi-agent options (Dynamic Workflows, Agent Teams) as unsuitable for isolated document processing
      - Parallelism constraint (10 max, proven safe; 20/30 unverified), 429 rate limiting handling for low tiers
      - Lease TTL (900s default) for stale claim cleanup and preventing double dispatch race conditions
    applicable_tasks:
      - index-docs SKILL performance optimization and parallelism tuning
      - Quality assurance testing for batch processing with multi-document context isolation
      - Orchestration architecture design for marketplace plugin constraints
      - Rate limit handling for different user tiers
      - Agent tool discovery and subagent isolation design
