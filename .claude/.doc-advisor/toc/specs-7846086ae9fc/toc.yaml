    title: "ADR-002: query-docs Guidance-Aware Dispatcher and Read-Only Worker Isolation"
    purpose: Defines isolation policy for query-docs SKILL, separating guidance-aware dispatcher from read-only search worker to prevent context mixing and ensure stable argument handling
    content_details:
      - Multi-layer architecture separating dispatcher (inheriting SKILL) from worker (isolated Agent)
      - Dispatcher responsibility limited to building search request from context and guidance
      - Worker role explicitly restricted to read-only document search operations
