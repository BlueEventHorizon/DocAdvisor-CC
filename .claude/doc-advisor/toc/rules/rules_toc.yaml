  rules/workflow/task_execution_workflow.md:
    title: タスク実行ワークフロー（Agent用）
    purpose: "Defines the standard workflow for task-executor Agent to implement tasks, from task information reception through execution, verification, and completion reporting"
    content_details:
      - "Step 1: Task information reception from orchestrator"
      - "Step 2: Pre-preparation (required documents reading, existing code confirmation)"
      - "Step 3: Implementation (Domain layer TDD cycle, other layers standard procedure)"
      - "Step 4: Verification (build confirmation, test execution, functionality check)"
      - "Step 5: Completion processing and reporting"
      - "Domain layer TDD workflow (Red, Green, Refactor phases)"
      - "Critical principles: single task per execution, follow orchestrator instructions, read all required documents"
      - "Forbidden actions: multiple task implementation, skipping required documents, subagent invocation"
      - "Implementation order (protocol definition, test creation, mock preparation, service implementation)"
    applicable_tasks:
