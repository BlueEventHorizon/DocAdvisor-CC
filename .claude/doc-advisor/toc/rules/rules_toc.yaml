  rules/workflow/design_workflow.md:
    title: 設計書作成ワークフロー
    purpose: 要件定義書から設計書作成への移行フェーズにおけるワークフロー定義。要件分析から設計書完成まで、段階的かつ確実なプロセスを提供する。
    content_details:
      - "Phase 1: 要件定義書の分析（機能要件確認、非機能要件確認、既存資産確認）"
      - "Phase 2: 設計書の作成（design_format.mdに基づくフォーマット準拠、設計IDの付与）"
      - "Phase 3: 品質保証（完全性確認、AIレビュー、人間レビュー、specs_toc.yaml更新）"
      - 既存コンポーネント活用の義務化（Tools/、Library/、既存実装の検索と再利用）
      - 禁止事項：ソースコード大量記載、技術選択理由未記載、レビュー未完了での着手
      - 重要な原則：要件定義書と設計書だけで実装可能、コードは基本的に書かない、既存資産を先に確認
      - よくある失敗パターン：既存コンポーネント検索不足、設計書へのソースコード記載、色・フォントのハードコード
      - チェックリスト：設計ID正確性、関連要件ID記載、要件反映確認、責務分離、ユースケースシーケンス図、人間レビュー承認
    applicable_tasks:
      - 設計書作成
      - 技術設計実施
      - 要件分析フェーズ
      - UI設計（画面、コンポーネント）
      - データモデル設計
    keywords:
      - 設計書
      - ワークフロー
      - 要件分析
      - Phase
      - デザイントークン
      - スペック
      - レビュー
      - tools/library
      - チェックリスト
      - 設計ID
