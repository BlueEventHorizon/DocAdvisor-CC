  rules/format/design_format.md:
    title: 設計書フォーマットルール
    purpose: 設計書作成における統一的なフォーマットを定義し、一貫性のある構造、AIエージェントの理解促進、要件とタスクのトレーサビリティ実現を実現する
    content_details:
      - 設計書は『How』を記述、『What』は要件定義書に記載
      - 必須構成要素：モジュールリスト、クラス図、ユースケース一覧、シーケンス図
      - 記載すべき内容：実装方法、技術的詳細、処理フロー、データフロー、状態管理、アーキテクチャ設計
      - 階層構造：トップレベル設計書とサービス単位の子設計書に分割
      - トップレベル設計書は001を使用、子設計書は連番付与
      - "ファイル命名規則：DES-XXX_{設計対象名}_design.md"
      - テンプレートの柔軟性：セクション名・順序は内容に応じて調整可能
      - メタデータ：設計ID、関連要件、実装層、主要モジュールを記載
      - "改定履歴：最終セクションに『## 改定履歴』として記載"
      - Mermaid図：フローチャート、クラス図、シーケンス図を使用推奨
    applicable_tasks:
      - 設計書テンプレート作成
      - 新規設計書作成
      - 既存設計書の品質確認
      - 設計書フォーマット統一化
      - アーキテクチャ設計レビュー
    keywords:
      - 設計書
      - フォーマット
      - トップレベル設計
      - 子設計書
      - モジュール設計
      - クラス図
      - シーケンス図
      - 改定履歴
