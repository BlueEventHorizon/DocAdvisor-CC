# Test-only .doc_structure.yaml for doc-db Layer 2 testing
# Use with store/restore pattern to avoid modifying project's real config
# doc_structure_version: 3.0

rules:
  root_dirs:
    - tests/fixtures/doc_db/rules/
  doc_types_map:
    tests/fixtures/doc_db/rules/: rule
  patterns:
    target_glob: "**/*.md"
    exclude: []

specs:
  root_dirs:
    - tests/fixtures/doc_db/specs/requirements/
    - tests/fixtures/doc_db/specs/design/
  doc_types_map:
    tests/fixtures/doc_db/specs/requirements/: requirement
    tests/fixtures/doc_db/specs/design/: design
  patterns:
    target_glob: "**/*.md"
    exclude: []
