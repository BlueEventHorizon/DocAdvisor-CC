# version_config_version: 1.0

targets:
  - name: doc-advisor
    version_file: plugins/doc-advisor/.claude-plugin/plugin.json
    version_path: version
    sync_files:
      - path: .claude-plugin/marketplace.json
        pattern: '"version": "{version}"'
        filter: '"version":'
      - path: README.md
        pattern: "**Version: {version}**"
        filter: "**Version:"
      - path: README_en.md
        pattern: "**Version: {version}**"
        filter: "**Version:"
        optional: true

changelog:
  file: CHANGELOG.md
  format: keep-a-changelog
  git_log_auto: false
  section_per_target: false

git:
  tag_format: "{version}"
  commit_message: "chore: bump to {version}"
  auto_tag: false
  auto_commit: false
