# === タスク一覧 ===
tasks:
  - task_id: TASK-001
    title: 確定した判断事項を設計書・要件定義書へ反映する
    priority: 95
    status: pending
    design_id: DES-008
    depends_on: []
    group_id: null
    build_check: per_task
    description:
      - DES-008 §6.1 に fm_to_pending の work-dir 一括処理を追記する（判断事項 D1）
      - DES-008 §6.4 のスキーマ規約一致テストを一方向の包含関係へ書き換える（判断事項 D3）
      - DES-008 §7.1 の無改造範囲を JSON 出力の追加を除く形へ限定する（判断事項 D6）
      - DES-008 §10 の未決 1・2 を決定事項として書き換える
      - REQ-006 の未確定事項表から TBD-001・TBD-002 を除去する
      - 改定履歴を古い順で追記する
    acceptance_criteria: DES-008 §6.1・§6.4・§7.1・§10 と REQ-006 未確定事項表が更新され、DES-008 §7.1 と §8.2 の間に矛盾する記述が残っていない
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - docs/specs/frontmatter/requirements/REQ-006_frontmatter_metadata_spec.md

  - task_id: TASK-002
    title: fm_core の読み取り系（境界切り出し・正規化・本文ハッシュ・スキーマ検証）を実装する
    priority: 90
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-001
    group_id: null
    build_check: per_task
    description:
      - plugins/doc-advisor/scripts/frontmatter/ を新設し fm_core.py を置く
      - フロントマター境界の切り出しを DES-008 §4.2 の定義で実装する
      - 本文正規化と本文ハッシュ算出を DES-008 §4.2 の規定で実装する
      - 信頼判定のスキーマ検証を DES-008 §5.1 の表に従って実装する（type はスカラ・配列の双方を受理）
      - toc_store.py / toc_utils.py を import しない（DES-008 §6.1 の独立性）
      - tests/scripts/frontmatter/test_fm_core.py に DES-008 §6.4 の本文ハッシュ・信頼判定の各分岐を書く
      - CLAUDE.md の Repository Layout に新設ディレクトリを追記する
    acceptance_criteria: 本文ハッシュが改行コード差と末尾空行差で不変・本文変更で変化・フロントマター変更で不変であり、信頼判定が DES-008 §6.4 の全分岐で期待どおり真偽を返し、テストが全通過する
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - docs/rules/implementation_guidelines.md

  - task_id: TASK-003
    title: fm_core の書き込み系（行保存マージ・type 和集合・YAML エスケープ）を実装する
    priority: 88
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-002
    group_id: null
    build_check: per_task
    description:
      - doc-advisor が単独所有する 6 キーのみを差し替える行保存型マージを実装する
      - type を置換せず和集合で更新する経路を実装する（DES-008 §4.1 / §4.5）
      - YAML 値のエスケープを toc_utils.yaml_escape と同一出力になる独立実装として置く
      - 未知キーを原文行のままバイト保持することをテストで固定する
      - 配布物 SKILL.md と formats 配下の既存フロントマターを入力にした往復テストを書く
      - toc_utils.yaml_escape と同じ入力で同じ出力になることを固定するテストを書く
    acceptance_criteria: 既存キーを持つ文書へ書き込んでも既存キーの行がバイト一致で保持され、temporary-feature-requirement のみを持つ文書への書き込みで type が既存値を保ったまま doc-advisor を含む配列になり、エスケープ一致テストが通過する
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - plugins/doc-advisor/formats/toc_format.md

  - task_id: TASK-004
    title: fm_read を実装し走査モードと JSON 出力契約を用意する
    priority: 85
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-002
    group_id: null
    build_check: per_task
    description:
      - fm_read.py に単一ファイルの信頼判定と JSON 出力を実装する
      - JSON 出力を DES-005 §8.1 の共通契約（status / error_code / warnings）に合わせる
      - 対象列挙のための走査モードを実装し、適用対象外の配布物ディレクトリを除外する（判断事項 D4）
      - 信頼判定が偽でかつ type に doc-advisor を含む場合のみ warning を出す（DES-008 §5.3）
      - tests/scripts/frontmatter/test_fm_read.py に判定分岐と除外の確認を書く
    acceptance_criteria: 走査モードの結果に配布物ディレクトリ配下のファイルが 1 件も含まれず、フロントマターを持たない文書が warning なしで対象外と判定され、テストが全通過する
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - docs/specs/base/design/DES-005_toc_generation_flow.md
      - docs/rules/cli_output_formatting.md

  - task_id: TASK-005
    title: fm_write を実装し整形後に本文ハッシュを打刻する
    priority: 78
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-003
    group_id: null
    build_check: per_task
    description:
      - fm_write.py にメタデータ受け取りとマージ書き込みを実装する
      - 整形コマンドを CLI 引数で受け取り、未指定なら実行しない（DES-008 §6.3）
      - 整形コマンドの実行はシェルを介さず、置換対象を対象ファイルのみに限定する
      - 書き込み・整形・打刻の順序を DES-008 §4.2 の規定どおりにする
      - tests/scripts/frontmatter/test_fm_write.py に冪等性と順序の確認を書く
    acceptance_criteria: 整形コマンド指定時と未指定時のいずれでも実行直後の fm_read が信頼できると判定し、同一文書へ 2 回連続実行しても 2 回目で内容が変化せず、テストが全通過する
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - docs/rules/implementation_guidelines.md

  - task_id: TASK-006
    title: write-frontmatter SKILL を新設する
    priority: 75
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-004
      - TASK-005
    group_id: null
    build_check: per_task
    description:
      - plugins/doc-advisor/skills/write-frontmatter/SKILL.md を継承型として作成する（判断事項 D2）
      - 対象の列挙を fm_read の走査モードに委ね、SKILL が手で列挙しない
      - 書き込み前に対象を提示してユーザー確認を取る手順を定める
      - 原本を書き換える副作用の発生条件を明記する
      - 処理ロジックを SKILL.md 内にインラインで書かない
      - 本リポジトリの docs 配下の数件へ実適用して挙動を確認する
    acceptance_criteria: 実適用後に dprint check が通り、適用対象外である配布物ディレクトリ配下のファイルが 1 件も変更されておらず、適用した文書を fm_read が信頼できると判定する
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - docs/rules/skill_authoring_notes.md
      - docs/rules/skill_launch_paths_definitions.md
      - docs/rules/implementation_guidelines.md

  - task_id: TASK-007
    title: fm_to_pending を実装し信頼できるフロントマターを pending へ転記する
    priority: 70
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-004
    group_id: null
    build_check: per_task
    description:
      - fm_to_pending.py に work-dir 一括処理を実装する（判断事項 D1）
      - 出力する pending の書式を write_pending.py の出力と一致させる
      - 信頼できない文書は pending を完了化せず残す
      - store_dir の解決や key の解釈を行わない（DES-008 §6.1 の独立性）
      - tests/scripts/frontmatter/test_fm_to_pending.py に転記とスキップの確認を書く
    acceptance_criteria: 信頼できるフロントマターを持つ文書の pending が完了状態で書き出され、スキーマ違反を含む文書の pending が未完了のまま残り、転記由来のエントリを validate_toc が受理する
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - plugins/doc-advisor/formats/toc_format.md

  - task_id: TASK-008
    title: index-docs の索引フローへ転記フェーズを組み込む
    priority: 68
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-007
    group_id: null
