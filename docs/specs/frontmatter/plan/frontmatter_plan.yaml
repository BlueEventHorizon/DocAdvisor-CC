  - task_id: TASK-010
    title: 索引フロー全体の統合テストと検索品質の回帰確認を行う
    priority: 62
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-008
    group_id: null
    build_check: per_task
    description:
      - フロントマターを持つ文書と持たない文書を混在させた統合テストを追加する
      - 転記由来のエントリで validate_toc が失敗しないことを固定する
      - スキーマ違反のフロントマターで警告が出て転記されないことを固定する
      - 打刻によるファイル全体ハッシュの変化が一巡で収束することを確認する
      - 検索品質のゴールデンセットで見落としと過剰包含が基準から劣化しないことを確認する
    acceptance_criteria: 統合テストが全通過し、混在ケースで toc.yaml の全エントリが生成され、ゴールデンセットの結果が実施前の基準と比べて悪化していない
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - docs/specs/base/requirements/FNC-002_zero_miss_search_accuracy_spec.md
      - DEVELOPMENT.md

  - task_id: TASK-011
