      - fm_to_pending が転記由来の値を書く
      - write_pending.py が AI 抽出由来の値を書くよう改修する
      - toc_format.md のメタ情報フィールド表へ追記する
      - 既存の write_pending のテストを追随させる
    acceptance_criteria: 転記経路と AI 抽出経路の pending がそれぞれ異なる来歴値を持ち、toc.yaml には来歴が書き出されず、既存テストが全通過する
    required_reading:
      - docs/specs/frontmatter/plan/frontmatter_strategy.md
      - docs/specs/frontmatter/design/DES-008_frontmatter_metadata.md
      - plugins/doc-advisor/formats/toc_format.md

  - task_id: TASK-012
    title: AI 抽出結果の書き戻し候補を提示する経路を追加する
    priority: 42
    status: pending
    design_id: DES-008
    depends_on:
      - TASK-006
      - TASK-008
      - TASK-011
    group_id: null
    build_check: per_task
    description:
