    group_id: null
    build_check: per_task
    description:
      - toc_format.md の言語規定を本文追従へ改訂する（DES-008 §4.4）
      - DES-005 のシーケンスへ転記経路を追記する
      - DES-005 のモジュール一覧へ frontmatter 配下の位置づけを追記する
