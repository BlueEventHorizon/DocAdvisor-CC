# new-if 実装計画書
#
# [追加 feature / 一時文書] この計画書は additive development の一時文書である。
# 正本は REQ-004（要件）/ DES-006（設計）。旧仕様（base/・既存ソース）と矛盾する場合は
# REQ-004 を最優先、次いで DES-006 に従う。
# 実装完了後、本計画書および new-if_strategy.md は破棄される ephemeral 文書
# （additive_development_spec §4: 計画 → 破棄）。要件・設計は base/ へ merge される。
#
# 実装戦略書: docs/specs/new-if/plan/new-if_strategy.md
# フェーズ: ② script 層（GROUP-001）→ ③ SKILL/agent 一本化 → ④ doc_structure 削除・仕様整合
#
# [確定] TBD-001（単体モードの最大ファイル数の警告閾値, NFR-N05）= 100 件（2026-05-30 当事者確定）。
# warning 機構は TASK-003 で実装し、この値を閾値定数に用いる（超過で warnings に追加・処理は継続）。

# === トレーサビリティ ===
# PRE-N01（上位層が desired state を決定）/ PRE-N03（embedding は責務外）は doc-advisor 実装対象外
# （上位層責務・非目的）のため requirements_traceability から除外。PRE-N02（単体モード前提）は FR-N04 でカバー。
requirements_traceability:
  - requirement_id: FR-N01
    title: key 単位 ToC 管理（opaque key・決定的変換・original key 保持・予約語 all）
    design_id: DES-006
